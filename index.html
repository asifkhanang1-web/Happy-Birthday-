<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday SUN-ENA! 🎉</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fed6e3 0%, #a8c1ef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* 🎈 Bada Balloon Size aur Card ke UPAR Layering */
        .balloon {
            position: absolute;
            width: 75px;
            height: 95px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            cursor: pointer;
            animation: floatUp 6s linear infinite;
            bottom: -120px;
            z-index: 999; /* Card ke upar laane ke liye */
            box-shadow: inset -7px -7px 12px rgba(0,0,0,0.15), 0 8px 15px rgba(0,0,0,0.1);
            user-select: none;
            touch-action: manipulation;
        }
        .balloon::after {
            content: "▲";
            color: inherit;
            font-size: 14px;
            position: absolute;
            bottom: -11px;
            left: 30px;
        }
        .balloon::before {
            content: "";
            position: absolute;
            width: 2px;
            height: 35px;
            background: rgba(0,0,0,0.2);
            bottom: -44px;
            left: 36px;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(15deg); opacity: 0; }
        }
        
        /* 🎴 Main Content Card */
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 480px;
            width: 100%;
            backdrop-filter: blur(10px);
            animation: fadeIn 1.5s ease-in-out;
            position: relative;
            z-index: 10;
        }
        h1 {
            color: #ff477e;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        .name-highlight {
            color: #ff1493;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            display: block;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite alternate;
        }
        
        /* 📸 Photos Grid Layout */
        .photos-section {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .photo-box {
            flex: 1;
            text-align: center;
        }
        .photo-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 8px;
            border-radius: 50%;
            border: 4px solid #ff477e;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        .photo-container.sender {
            border-color: #4a90e2;
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #555;
        }

        p {
            font-size: 1.05rem;
            color: #444;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .music-btn {
            background-color: #ff477e;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 5px 10px rgba(255, 71, 126, 0.3);
        }
        .music-btn:active { transform: scale(0.95); }

        .pop-score {
            font-size: 0.95rem;
            color: #d63384;
            margin-top: 15px;
            font-weight: bold;
        }

        /* 💬 Balloon Phodne Par Quote Pop-up */
        .quote-bubble {
            position: fixed;
            background: #ffffff;
            color: #333333;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            pointer-events: none;
            z-index: 10000;
            border: 2px solid #ff477e;
            white-space: nowrap;
            animation: floatWish 2s ease-out forwards;
        }

        @keyframes floatWish {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -70%) scale(1.1); opacity: 1; }
            80% { transform: translate(-50%, -100%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -130%) scale(0.9); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="birthday-song.mp3" loop></audio>

    <div class="card">
        <h1>Happy Birthday 🎂</h1>
        <span class="name-highlight">SUN-ENA ✨</span>
        
        <div class="photos-section">
            <div class="photo-box">
                <div class="photo-container">
                    <img src="birthday-girl1.jpg" alt="SUN-ENA">
                </div>
                <div class="photo-label">Birthday Girl 👸</div>
            </div>
            
            <div class="photo-box">
                <div class="photo-container sender">
                    <img src="sender.jpg" alt="Best Wishes From">
                </div>
                <div class="photo-label">With Love From 🙋‍♂️</div>
            </div>
        </div>

        <p>Wishing you a day filled with beautiful moments, endless laughter, and true happiness. May all your dreams come true this year! Keep shining like a star! 🌟🥳</p>

        <button class="music-btn" onclick="toggleMusic()">🎵 Play Music</button>
        <div class="pop-score">🎈 Balloons ko touch karke phodein aur wishes dekhein!</div>
    </div>

    <script>
        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.querySelector('.music-btn');
            if (music.paused) {
                music.play().catch(e => alert("Please tap screen first!"));
                btn.innerText = "⏸️ Pause Music";
                btn.style.backgroundColor = "#4a90e2";
            } else {
                music.pause();
                btn.innerText = "🎵 Play Music";
                btn.style.backgroundColor = "#ff477e";
            }
        }

        const colors = ['#ff477e', '#ff1493', '#7000ff', '#00bfff', '#32cd32', '#ff8c00', '#ff0055'];

        // ✨ Birthday Wishes Quotes Jo Phodne Par Dikhange
        const wishes = [
            "✨ Stay Blessed Always!",
            "🎂 Happy Birthday SUN-ENA!",
            "💖 Keep Smiling & Shining!",
            "🎉 May All Your Dreams Come True!",
            "🌟 You Are Amazing!",
            "🍰 Have The Sweetest Year Ever!",
            "🥳 Celebrate Like A Queen!",
            "🌸 Lots Of Love & Happiness!"
        ];

        function showQuote(x, y) {
            const quote = document.createElement('div');
            quote.className = 'quote-bubble';
            const randomWish = wishes[Math.floor(Math.random() * wishes.length)];
            quote.innerText = randomWish;
            quote.style.left = x + 'px';
            quote.style.top = y + 'px';
            document.body.appendChild(quote);

            setTimeout(() => {
                quote.remove();
            }, 2000);
        }

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            balloon.style.backgroundColor = randomColor;
            balloon.style.color = randomColor;
            balloon.style.left = Math.random() * 85 + 'vw';
            balloon.style.animationDuration = (Math.random() * 2.5 + 4) + 's';

            function pop(e) {
                e.stopPropagation();
                const rect = balloon.getBoundingClientRect();
                const clickX = rect.left + rect.width / 2;
                const clickY = rect.top + rect.height / 2;

                showQuote(clickX, clickY);

                balloon.style.transform = 'scale(1.4)';
                balloon.style.opacity = '0';
                setTimeout(() => { balloon.remove(); }, 120);
            }

            balloon.addEventListener('click', pop);
            balloon.addEventListener('touchstart', pop, { passive: false });

            document.body.appendChild(balloon);

            setTimeout(() => { 
                if (balloon.parentNode) {
                    balloon.remove(); 
                }
            }, 7000);
        }

        setInterval(createBalloon, 800);
    </script>

</body>
</html>
